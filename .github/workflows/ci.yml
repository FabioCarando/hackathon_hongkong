name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # --locked fails if uv.lock does not match pyproject.toml (someone edited one without the other)
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
        env:
          LLM_PROVIDER: fake
